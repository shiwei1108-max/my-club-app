<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>社團活動管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto mb-6 flex justify-between items-center bg-white p-4 rounded shadow">
        <div class="flex gap-4 items-center">
            <h1 class="text-xl font-bold text-gray-800">📅 社團活動</h1>
            <div class="h-6 w-px bg-gray-300"></div>
            <a href="/dashboard.html" class="text-gray-500 hover:text-blue-600 py-1">📊 儀表板</a>
            <a href="/index.html" class="text-gray-500 hover:text-blue-600 py-1">👥 成員管理</a>
            <a href="/events.html" class="text-blue-600 font-bold py-1 border-b-2 border-blue-600">📅 活動管理</a>
        </div>
        <button onclick="logout()" class="text-red-600 hover:text-red-800">登出</button>
    </div>

    <div class="max-w-4xl mx-auto bg-white p-8 shadow-lg rounded">
        <div class="bg-green-50 p-4 mb-6 border border-green-200 rounded">
            <h3 class="font-bold mb-2 text-green-800">➕ 發布新活動</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input id="title" type="text" placeholder="*活動名稱 (例如: 期初大會)" class="border p-2 rounded w-full">
                <input id="date" type="date" class="border p-2 rounded w-full">
                <input id="desc" type="text" placeholder="活動說明 (選填)" class="border p-2 rounded w-full md:col-span-2">
            </div>
            <button onclick="addEvent()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 font-bold">發布活動</button>
        </div>

        <div class="space-y-4" id="eventList">
            </div>
    </div>

    <script>
        const token = localStorage.getItem('club_token');
        if (!token) window.location.href = '/login.html';

        loadEvents();

        async function authFetch(url, options = {}) {
            const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) logout();
            return res;
        }

        async function loadEvents() {
            const res = await authFetch('/api/events');
            const events = await res.json();
            const container = document.getElementById('eventList');
            
            container.innerHTML = events.map(e => `
                <div class="p-4 border rounded hover:shadow-md flex justify-between items-center bg-white">
                    <div>
                        <div class="text-sm text-gray-500">📅 ${new Date(e.date).toLocaleDateString()}</div>
                        <div class="text-lg font-bold text-gray-800">${e.title}</div>
                        <div class="text-gray-600">${e.description || '無說明'}</div>
                    </div>
                    <button onclick="deleteEvent(${e.id})" class="text-red-500 hover:text-red-700 border border-red-200 px-3 py-1 rounded">刪除</button>
                </div>
            `).join('') || '<div class="text-center text-gray-400">目前沒有活動</div>';
        }

        async function addEvent() {
            const title = document.getElementById('title').value;
            const date = document.getElementById('date').value;
            const description = document.getElementById('desc').value;

            if(!title || !date) return alert('名稱和日期是必填的！');

            const res = await authFetch('/api/events', {
                method: 'POST',
                body: JSON.stringify({ title, date, description })
            });

            if(res.ok) {
                document.querySelectorAll('input').forEach(i => i.value = '');
                loadEvents();
            } else {
                alert('發布失敗');
            }
        }

        async function deleteEvent(id) {
            if(confirm('確定取消這個活動嗎？')) {
                await authFetch(`/api/events/${id}`, { method: 'DELETE' });
                loadEvents();
            }
        }

        function logout() {
            localStorage.removeItem('club_token');
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
